# collectd → rustikv-telemetry-gateway (Graphite plaintext)
#
# Drop this into /etc/collectd/collectd.conf.d/ on the Raspberry Pi (or append
# to collectd.conf) and restart collectd. It ships metrics to the gateway's
# ingest port as Graphite plaintext (`metric.path value timestamp\n`).
#
# Replace GATEWAY_IP with the host running rustikv-telemetry-gateway.

LoadPlugin write_graphite

<Plugin write_graphite>
  <Node "gateway">
    Host "GATEWAY_IP"
    Port "2003"
    Protocol "tcp"
    # Every metric key is prefixed with "pi." so a single rustikv namespace
    # (PREFIX "pi.") covers this host. Use a per-host prefix if you add more Pis.
    Prefix "pi."
    # Emit rates (per-second deltas) for counters instead of raw totals — these
    # are gauge-like values, which is what the gateway writes as points.
    StoreRates true
    # collectd uses "/" in some metric names; keep "." as the separator so keys
    # stay clean for the gateway's `metric:timestamp` schema.
    EscapeCharacter "."
    SeparateInstances true
  </Node>
</Plugin>

# Suggested plugins to actually collect host metrics:
# LoadPlugin cpu
# LoadPlugin memory
# LoadPlugin load
# LoadPlugin df
# LoadPlugin thermal   # Raspberry Pi SoC temperature
# LoadPlugin interface
