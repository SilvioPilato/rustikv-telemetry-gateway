# collectd → rustikv-telemetry-gateway (Graphite plaintext)
#
# Drop this into /etc/collectd/collectd.conf.d/ on the Raspberry Pi (or append
# to collectd.conf) and restart collectd. It ships metrics to the gateway's
# ingest port as Graphite plaintext (`metric.path value timestamp\n`).
#
# Replace GATEWAY_IP with the host running rustikv-telemetry-gateway.
#
# Metric path schema (with Prefix "pi." and SeparateInstances true):
#   pi.HOSTNAME.PLUGIN[-INSTANCE].TYPE[-TYPE_INSTANCE][.DS]
# e.g.
#   pi.raspberrypi.cpu.percent-user
#   pi.raspberrypi.memory.memory-used
#   pi.raspberrypi.load.load.shortterm
#   pi.raspberrypi.thermal-thermal_zone0.temperature
#   pi.raspberrypi.interface-eth0.if_octets.rx
#   pi.raspberrypi.disk-mmcblk0.disk_octets.read
#   pi.raspberrypi.df-root.df_complex-used

# ── Output ───────────────────────────────────────────────────────────────────
LoadPlugin write_graphite

<Plugin write_graphite>
  <Node "gateway">
    Host "GATEWAY_IP"
    Port "2003"
    Protocol "tcp"
    # Every metric key is prefixed with "pi." so a single rustikv namespace
    # (PREFIX "pi.") covers this host. Use a per-host prefix if you add more Pis.
    Prefix "pi."
    # Emit rates (per-second deltas) for counters instead of raw totals.
    StoreRates true
    # collectd uses "/" in some metric names; keep "." as separator.
    EscapeCharacter "."
    SeparateInstances true
    # Don't append the DS name for single-DS types (keeps names shorter).
    AlwaysAppendDS false
  </Node>
</Plugin>

# ── CPU ──────────────────────────────────────────────────────────────────────
LoadPlugin cpu

<Plugin cpu>
  # Aggregate across all cores (single set of percent-user/system/etc keys).
  ReportByCpu false
  # Report as percentage (0–100) rather than jiffies.
  ValuesPercentage true
</Plugin>

# ── Memory ───────────────────────────────────────────────────────────────────
LoadPlugin memory

<Plugin memory>
  # Report in bytes.
  ValuesAbsolute true
  ValuesPercentage false
</Plugin>

# ── Load average ─────────────────────────────────────────────────────────────
LoadPlugin load
# No configuration block needed; emits shortterm (1m), midterm (5m), longterm (15m).

# ── Filesystem space ─────────────────────────────────────────────────────────
LoadPlugin df

<Plugin df>
  # Only track the root filesystem; add more MountPoint lines as needed.
  MountPoint "/"
  # Report in bytes (not percentages).
  ValuesAbsolute true
  # Ignore tmpfs, devtmpfs, etc.
  FSType "rootfs"
  FSType "ext4"
  IgnoreSelected false
</Plugin>

# ── SoC temperature ──────────────────────────────────────────────────────────
LoadPlugin thermal
# Reads /sys/class/thermal/thermal_zone*/temp; emits temperature in Celsius.
# Metric: pi.HOSTNAME.thermal-thermal_zone0.temperature

# ── Network ──────────────────────────────────────────────────────────────────
LoadPlugin interface

<Plugin interface>
  # Adjust to your Pi's interface name (ip link to check).
  Interface "eth0"
  Interface "wlan0"
  IgnoreSelected false
</Plugin>

# ── Disk I/O ─────────────────────────────────────────────────────────────────
LoadPlugin disk

<Plugin disk>
  # mmcblk0 is the SD card on a Raspberry Pi; sda if using a USB drive.
  Disk "mmcblk0"
  IgnoreSelected false
</Plugin>

